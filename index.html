<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo Workshop</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Todo Workshop</h1>
      <form id="new-task" class="new-task">
        <label for="task-title">New task</label>
        <input id="task-title" name="title" autocomplete="off" required />
        <button type="submit">Add</button>
      </form>
      <ul id="tasks" class="tasks"></ul>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
